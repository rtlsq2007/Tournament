name = "ckment"
main = "worker/index.js"
compatibility_date = "2024-12-01"

# 정적 사이트(빌드 결과 dist)를 워커 자산으로 서빙. SPA 라우팅(/t/:id/admin 등)을 위해 단일 페이지 폴백.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "ckment-db"
database_id = "01eb28b9-ddf0-452a-91e9-5ba1e86ff56a"
